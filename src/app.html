<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			// the remembered ink set, before first paint
			try {
				const t = localStorage.getItem('theme');
				if (t === 'seibu' || t === 'mori') document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		%sveltekit.head%
		<!-- GoatCounter: cookieless page counts; skips localhost on its own -->
		<script
			data-goatcounter="https://koraysels.goatcounter.com/count"
			async
			src="https://gc.zgo.at/count.js"
		></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
